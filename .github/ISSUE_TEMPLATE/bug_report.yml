name: Bug report
description: Something in the app does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. *Puedes escribir en español si lo prefieres.*

        **Never paste passwords, private keys or real hostnames** into an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to a saved profile
        2. Open the file explorer
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Linux (desktop)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Ajustes → Acerca de.
      placeholder: "2.8.1+70"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version / device
      placeholder: "Android 14, Pixel 7 — or Arch Linux, GNOME 47"
  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshots
      description: Terminal output helps a lot. Redact anything identifying first.
