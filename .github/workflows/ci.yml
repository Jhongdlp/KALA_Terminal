name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Infos (deprecated withOpacity, etc.) are pre-existing and tracked
      # separately; CI fails on warnings and errors only.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

      # Spanish is the source language. A missing entry only falls back to
      # Spanish at runtime, but a string nobody can read is a bug in the
      # language it was meant for — so this fails the build.
      - name: i18n coverage
        run: python3 scripts/i18n_check.py
